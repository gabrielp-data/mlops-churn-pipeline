name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests streamlit_app.py
      - run: uv run pytest -q
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
          MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: churn-ci
      CHURN_DATA_PATH: data/telco-public.csv
      CHURN_DATABASE_URL: postgresql+psycopg://churn:ci-ephemeral-password@db:5432/churn
      POSTGRES_PASSWORD: ci-ephemeral-password
      MLFLOW_DISABLE_AGENT_HINT: "1"
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --frozen --python 3.12
      - name: Prepare champion and batch from the pinned public dataset
        run: |
          uv run python -m churn.fetch_data
          uv run python -m churn.model
          uv run python -m churn.registry
          uv run python -m churn.export_champion
          uv run python -m churn.predict
      - name: Build and verify Docker with real PostgreSQL
        run: bash scripts/test_containers.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile database --profile batch logs --no-color --tail=100
      - name: Stop isolated test containers
        if: always()
        run: docker compose --profile database --profile batch down --volumes
