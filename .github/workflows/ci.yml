name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: churn_test
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: churn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U churn_test -d churn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            streamlit_cloud/requirements.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Test model, API, dashboard and real PostgreSQL
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://churn_test:ephemeral-ci-password@localhost:5432/churn_test
          MLFLOW_DISABLE_AGENT_HINT: "1"
