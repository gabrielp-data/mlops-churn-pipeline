[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; API_MODULE e FRONTEND escolhem a versão (padrão v2, definido no Dockerfile.app).
; As variáveis DB_* do `docker run --env-file` são herdadas pelos processos abaixo.

[program:backend]
command=uvicorn %(ENV_API_MODULE)s:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:frontend]
command=streamlit run %(ENV_FRONTEND)s --server.port 8501 --server.address 0.0.0.0 --server.headless true
directory=/app
environment=API_URL="http://127.0.0.1:8000"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
