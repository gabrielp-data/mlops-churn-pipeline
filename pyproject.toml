[project]
name = "churn"
version = "0.1.0"
description = "Previsão de churn — projeto-fio-condutor do curso de MLOps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandera[pandas]>=0.18",
    "mlflow>=3.0",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.35",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.9",
    "pyarrow>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "dvc>=3.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
