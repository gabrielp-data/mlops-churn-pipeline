services:
  treino:
    build: .
    volumes:
      - ./src:/app/src         # edita local, roda no container
      - ./data:/app/data       # dado via bind mount (sem rebuild)
      - ./artifacts:/app/artifacts
    command: uv run python -m churn.model

  grid:
    build: .
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    command: uv run python -m churn.experiments

  # Encontro 11 — Airflow standalone (scheduler + webserver + SQLite) em localhost:8080
  # usuário admin; a senha é impressa no log: docker compose logs airflow | grep password
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      MLFLOW_TRACKING_URI: sqlite:////opt/airflow/project/mlruns/mlflow.db
      CHURN_DATA_PATH: /opt/airflow/project/data/churn.csv
      CHURN_ARTIFACT_PATH: /opt/airflow/project/artifacts/churn_model.pkl
      PYTHONPATH: /opt/airflow/project/src   # edição local reflete sem rebuild
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - ./artifacts:/opt/airflow/project/artifacts
      - ./mlruns:/opt/airflow/project/mlruns
    working_dir: /opt/airflow/project
    command: airflow standalone

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./artifacts:/app/artifacts
    command: uv run uvicorn churn.app:app --host 0.0.0.0 --port 8000
