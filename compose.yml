services:
  db:
    image: postgres:16
    profiles: [database]
    environment:
      POSTGRES_DB: churn
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem porta publicada: a aplicação acessa db:5432 pela rede do Compose.

  app:
    build:
      context: .
      target: serving
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8501:8501"
    environment:
      CHURN_API_URL: http://127.0.0.1:8000
      CHURN_DATABASE_URL: ${CHURN_DATABASE_URL:-}
      CHURN_DATA_PATH: ${CHURN_DATA_PATH:-data/churn.csv}
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  lookup:
    profiles: [batch]
    build:
      context: .
      target: serving
    environment:
      CHURN_SERVING_MODE: batch
      CHURN_BATCH_PATH: /app/data/batch_predictions.parquet
      CHURN_API_URL: http://127.0.0.1:8000
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:8502:8501"

  treino:
    profiles: [training]
    build:
      context: .
      target: training
    environment:
      CHURN_TRACKING_URI: sqlite:////app/state/mlflow.db
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./.state:/app/state
    command: ["python", "-m", "churn.model"]

volumes:
  pgdata:
